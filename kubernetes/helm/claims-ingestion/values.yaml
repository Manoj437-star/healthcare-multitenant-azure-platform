replicaCount: 2

image:
  repository: acrhealthcareplatformdev.azurecr.io/claims-ingestion-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

tenantId: "shared-platform"
environment: "dev"

serviceAccount:
  create: true
  name: "claims-ingestion-sa"
  annotations:
    azure.workload.identity/client-id: ""

podAnnotations: {}
podLabels:
  app: claims-ingestion
  tenant: "shared-platform"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

keyVaultCsi:
  enabled: true
  secretProviderClassName: "azure-kv-secrets-provider-shared"
  secretName: "shared-app-secrets"

config:
  eventBusProvider: "ServiceBus"
  databaseName: "HealthcarePlatform"
  enableSwagger: false

keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 20
  pollingInterval: 15
  cooldownPeriod: 300
  messageCountTarget: 50
  topicName: "member-events"
  subscriptionName: "sub-claims-ingestion-member-enrolled"
