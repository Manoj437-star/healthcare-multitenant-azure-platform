global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'member-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['member-service:8080']

  - job_name: 'claims-ingestion'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['claims-ingestion-service:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
