apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-secrets-provider
  namespace: tenant-a
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "${WORKLOAD_IDENTITY_CLIENT_ID}" # Workload Identity Client ID
    keyvaultName: "kv-healthcare-platform-dev"
    cloudName: "AzurePublicCloud"
    objects: |
      array:
        - |
          objectName: sql-conn-tenant-a
          objectType: secret
          objectVersion: ""
        - |
          objectName: servicebus-connection-string
          objectType: secret
          objectVersion: ""
    tenantId: "${AZURE_TENANT_ID}"
  secretObjects:
    - secretName: tenant-a-app-secrets
      type: Opaque
      data:
        - objectName: sql-conn-tenant-a
          key: ConnectionStrings__MemberDbConnection
        - objectName: servicebus-connection-string
          key: ConnectionStrings__ServiceBusConnection
---
