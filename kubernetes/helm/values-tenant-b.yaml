# -------------------------------------------------------------
# Helm Values for Tenant-B (Standard Payer)
# -------------------------------------------------------------
tenantId: "tenant-b"
environment: "dev"
replicaCount: 2

podLabels:
  app: member-service
  tenant: "tenant-b"
  tier: "standard"

serviceAccount:
  create: true
  name: "member-service-sa-tenant-b"
  annotations:
    azure.workload.identity/client-id: "66666666-7777-8888-9999-000000000000"

keyVaultCsi:
  enabled: true
  secretProviderClassName: "azure-kv-secrets-provider"
  secretName: "tenant-b-app-secrets"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

config:
  eventBusProvider: "ServiceBus"
  enableSwagger: false
