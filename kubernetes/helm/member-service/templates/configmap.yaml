apiVersion: v1
kind: ConfigMap
metadata:
  name: member-service-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: member-service
    tenant: {{ .Values.tenantId }}
data:
  ASPNETCORE_ENVIRONMENT: {{ quote .Values.environment }}
  EventBus__Provider: {{ quote .Values.config.eventBusProvider }}
  EnableSwagger: {{ quote .Values.config.enableSwagger }}
  Serilog__MinimumLevel__Default: "Information"
