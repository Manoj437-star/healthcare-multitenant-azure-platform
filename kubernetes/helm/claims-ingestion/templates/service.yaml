apiVersion: v1
kind: Service
metadata:
  name: claims-ingestion
  namespace: {{ .Release.Namespace }}
  labels:
    app: claims-ingestion
    tenant: {{ .Values.tenantId }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: claims-ingestion
