# -------------------------------------------------------------
# Helm Values for Tenant-A (Tier 1 Enterprise Payer)
# -------------------------------------------------------------
tenantId: "tenant-a"
environment: "dev"
replicaCount: 3

podLabels:
  app: member-service
  tenant: "tenant-a"
  tier: "enterprise"

serviceAccount:
  create: true
  name: "member-service-sa-tenant-a"
  annotations:
    azure.workload.identity/client-id: "11111111-2222-3333-4444-555555555555"

keyVaultCsi:
  enabled: true
  secretProviderClassName: "azure-kv-secrets-provider"
  secretName: "tenant-a-app-secrets"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

config:
  eventBusProvider: "ServiceBus"
  enableSwagger: false
